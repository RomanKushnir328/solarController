<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" width=device-width, initial-scale=1.0, user-scalable=yes />
    <meta charset="UTF-8">
    <title> SolarStationControl</title>
    <style>
        html {
            text-align: center;
            font-family: Helvetica;
            color:
                aliceblue;
            background-color: #151618;
        }

        h1 {
            font-size: xx-large;
        }

        h2 {
            font-size: x-large;
        }

        button {
            position:
                center;
            background-color: #04859D;
            font-size: x-large;
            border-radius: 20px;
            color: rgb(16, 16, 16);
        }

        .toggleButton {
            background-color: #FF7C00;
            font-size: medium;
            color: rgb(16, 16, 16);
        }

        .formButton {
            background-color: #186F05;
            font-size: medium;
            border-radius: 15px;
            color: rgb(212, 212, 212);
        }

        .container {
            display:
                grid;
            grid-template-columns: 1fr 1fr;
            gap:
                20px;
        }

        .box {
            width:
                95%;
            padding:
                10px;
            text-align: center;
        }

        @media(max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        #graph {
            background-color: rgb(16, 16, 16);
            width:
                100%;
            max-height: 600px;
        }
    </style>
</head>

<body>
    <h1>SolarStationControl</h1>
    <div class="container">
        <div class="box">

            <!--VOLTAGES, WEATHER AND CONTROL-->

            <h2>Weather now</h2>
            <p>Sensors aren`t connected</p>
            <h2>Voltages</h2>
            <p>ADS aren`t connected</p>
            <h2>Control</h2>
            <button onclick="window.location.href='/outOff'">outOff</button>
            <button onclick="window.location.href = '/reset'">reset</button>

            <!--VOLTAGES, WEATHER AND CONTROL-->

            <!--SETTINGS-->

            <h2>Settings</h2>
            <form method="POST" action="/post">
                <h3>WiFi connection</h3>
                <p>Wi-Fi ssid <input type="text" name="wifiSsid" value="YOUR WIFI"></p>
                <p>Wi-Fi pass:
                    <input type="password" id="wifiPass" name="wifiPass" value="YOUR WIFI PASS" required>
                    <button class="toggleButton" type="button" id="toggleWifiPass"
                        onclick="toggleWifiPassword()">Show</button>
                </p>
                <h3>AP</h3>
                <p>AP ssid <input type="text" name="apSsid" value="solarController"></p>
                <p>AP pass:
                    <input type="password" id="apPass" name="apPass" value="12345" required>
                    <button class="toggleButton" type="button" id="toggleApPass"
                        onclick="toggleApPassword()">Show</button>
                </p>
                <input class="formButton" type="submit" value="send and reconect">
            </form>

            <!--SETTINGS-->

        </div>

        <!--FORM-->

        <div class="box" id="graphContainer">
            <h2>Weather graph</h2>
            <form action="/graph" method="GET">
                <label for="choiceGraphPeriod">Chose graph period: </label>
                <select id="choiceGraphPeriod" name="choiceGraphPeriod" onchange="this.form.submit()">
                    <option value="lastDay" selected>lastDay</option>
                    <option value="lastWeek">lastWeek</option>
                    <option value="lastMonth">lastMonth</option>
                    <option value="lastYear">lastYear</option>
                </select>
            </form>
            <form action="/graph" method="GET">
                <label for="choiceGraphType">Chose graph type: </label>
                <select id="choiceGraphType" name="choiceGraphType" onchange="this.form.submit()">
                    <option value="solPower">Solar power</option>
                    <option value="temperature">Temperature</option>
                    <option value="pressure" selected>Preassure</option>
                    <option value="humidity">Humidity</option>
                </select>
            </form>

            <!--FORM-->

            <canvas id="graph"></canvas>
            <script>
                function toggleWifiPassword() {
                    var wifiPassInput = document.getElementById("wifiPass");
                    var wifiToggleBtn = document.getElementById("toggleWifiPass");
                    if (wifiPassInput.type === "password") {
                        wifiPassInput.type = "text";
                        wifiToggleBtn.textContent = "Hide";
                    } else {
                        wifiPassInput.type = "password";
                        wifiToggleBtn.textContent = "Show";
                    }
                }
                function toggleApPassword() {
                    var apPassInput = document.getElementById("apPass");
                    var apToggleBtn = document.getElementById("toggleApPass");
                    if (apPassInput.type === "password") {
                        apPassInput.type = "text";
                        apToggleBtn.textContent = "Hide";
                    } else {
                        apPassInput.type = "password";
                        apToggleBtn.textContent = "Show";
                    }
                }
                function printGraph(width, height) {

                    //<!--DATA-->

                    const data = [
                        -5.0, -4.8, -4.6, -4.5, -4.2, -3.9, -3.5, -2.8,
                        -1.9, -0.5, 0.2, 1.1, 1.8, 1.4, 0.7, -0.2,
                        -1.3, -2.1, -2.9, -3.4, -4.0, -4.5, -4.7, -5.0
                    ];

                    const labels = [
                        "00:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00", "07:00",
                        "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00",
                        "16:00", "17:00", "18:00", "19:00", "20:00", "21:00", "22:00", "23:00"
                    ];

                    //<!--DATA-->

                    const canvas = document.getElementById("graph");
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext("2d");

                    const fontSize = 20;
                    const smallIndents = 5;

                    if (data.length > 0) {
                        if (data.length == labels.length) {
                            const dataMax = Math.max(...data);
                            const dataMin = Math.min(...data);
                            const difference = dataMax - dataMin;

                            ctx.font = `${fontSize}px roboto`;
                            const dataSum = data.reduce((a, b) => a + b, 0);
                            const dataAverange = dataSum / data.length;

                            const horizontalLabelsWidth = fontSize + smallIndents * 2;
                            const verticalLabelsWidth = Math.max(...data.map(n => ctx.measureText(n.toString()).width)) + smallIndents * 2;

                            width -= verticalLabelsWidth;
                            height -= 2 * horizontalLabelsWidth;
                            const horizontalColomsNum = Math.round((height + horizontalLabelsWidth) / horizontalLabelsWidth);

                            const totalWidth = labels.reduce((sum, label) => {
                                return sum + ctx.measureText(label).width;
                            }, 0);
                            const labelsAverangePx = (totalWidth / labels.length) + smallIndents * 2;
                            const posibleLabelNum = (width / labelsAverangePx) * 2;
                            const labelNum = posibleLabelNum > labels.length ? labels.length : posibleLabelNum;
                            const colomsNumToChangeLabel = Math.ceil(data.length / labelNum);

                            const stepX = width / data.length;
                            const stepY = height / difference;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.beginPath();

                            // graph
                            ctx.strokeStyle = "blue";
                            ctx.lineWidth = 3;
                            for (let i = 0; i < data.length; i++) {
                                pointX = i * stepX + verticalLabelsWidth;
                                pointY = horizontalLabelsWidth + height - height * ((data[i] - dataMin) / difference);
                                ctx.lineTo(pointX, pointY);
                            }
                            ctx.stroke();
                            ctx.beginPath();

                            //vertical lines
                            ctx.strokeStyle = "white";
                            ctx.lineWidth = 1;
                            side = true; // if true upper side 
                            for (let i = 0; i < data.length; i++) {
                                pointX = i * stepX + verticalLabelsWidth;
                                ctx.moveTo(pointX, 0);
                                if (i % colomsNumToChangeLabel === 0 && data.length - i >= colomsNumToChangeLabel * 2) {
                                    ctx.fillStyle = "white";
                                    if (side) {
                                        ctx.moveTo(pointX, 0);
                                        ctx.lineTo(pointX, canvas.height - horizontalLabelsWidth);
                                        ctx.fillText(labels[i], pointX + smallIndents, horizontalLabelsWidth - smallIndents);
                                        side = !side;
                                    } else {
                                        ctx.moveTo(pointX, horizontalLabelsWidth);
                                        ctx.lineTo(pointX, canvas.height);
                                        ctx.fillText(labels[i], pointX + smallIndents, canvas.height - smallIndents);
                                        side = !side;
                                    }
                                } else {
                                    ctx.moveTo(pointX, horizontalLabelsWidth);
                                    ctx.lineTo(pointX, canvas.height - horizontalLabelsWidth);
                                }
                            }
                            ctx.stroke();
                            ctx.beginPath();

                            //horizontal lines
                            for (let i = 0; i < horizontalColomsNum + 1; i++) {
                                labelY = horizontalLabelsWidth + i * (height / horizontalColomsNum);
                                ctx.moveTo(0, labelY);
                                ctx.fillStyle = "white";
                                ctx.fillText((dataMax - (difference / horizontalColomsNum) * i).toFixed(1), smallIndents, labelY - 5);
                                ctx.lineTo(canvas.width, labelY);
                                ctx.stroke();
                                ctx.beginPath();
                                ctx.moveTo(pointX, pointY);
                            }

                        } else {
                            ctx.font = "15px roboto";
                            ctx.fillText("Data and labels lengths don`t match", smallIndents, 15 + smallIndents);
                            ctx.stroke();
                        }
                    } else {
                        ctx.font = "60px roboto";
                        ctx.fillText("No data", smallIndents, 60 + smallIndents);
                        ctx.stroke();
                    }
                }
                function updateGraphSize() {
                    const graphContainer = document.getElementById("graphContainer");
                    const rect = graphContainer.getBoundingClientRect();
                    printGraph(rect.width, rect.height);
                }
                window.onload = updateGraphSize;
                window.addEventListener("resize", updateGraphSize);
            </script>
        </div>
    </div>
</body>

</html>
